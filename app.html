<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>گیاهان دارویی</title>
<style>
  :root { --bg:#f6f7f4; --card:#fff; --acc:#2e7d32; --acc2:#e8f0e9; --txt:#22301f; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:Tahoma,"Segoe UI",Vazirmatn,sans-serif; background:var(--bg); color:var(--txt); }
  header { position:sticky; top:0; z-index:5; background:var(--acc); color:#fff; padding:10px 14px; box-shadow:0 2px 6px rgba(0,0,0,.2); }
  header h1 { margin:0 0 8px; font-size:18px; }
  .searchwrap { display:flex; gap:8px; }
  #q { flex:1; padding:10px 12px; font-size:16px; border:none; border-radius:8px; outline:none; direction:rtl; }
  #cnt { font-size:12px; margin-top:6px; opacity:.9; }
  main { padding:10px; max-width:640px; margin:0 auto; padding-bottom:60px; }
  .item { display:flex; align-items:center; gap:12px; background:var(--card); border-radius:10px; padding:8px 12px; margin-bottom:8px; cursor:pointer; box-shadow:0 1px 3px rgba(0,0,0,.08); }
  .item:active { background:var(--acc2); }
  .item img { width:52px; height:52px; border-radius:8px; object-fit:cover; background:#eee; flex-shrink:0; }
  .item .nm { font-size:16px; }
  .item .sci { font-size:12px; color:#777; direction:ltr; text-align:right; }
  mark { background:#ffe082; padding:0 1px; border-radius:2px; }
  .detail { background:var(--card); border-radius:12px; padding:16px; box-shadow:0 1px 4px rgba(0,0,0,.1); }
  .detail h2 { margin:8px 0 2px; font-size:22px; }
  .detail .sci { color:#666; direction:ltr; text-align:right; margin-bottom:6px; }
  .chip { display:inline-block; background:var(--acc2); color:var(--acc); border-radius:999px; padding:3px 10px; font-size:13px; margin:2px; }
  .sec { margin-top:14px; }
  .sec h3 { font-size:15px; margin:0 0 6px; color:var(--acc); }
  ul { margin:0; padding-inline-start:20px; }
  li { margin-bottom:4px; line-height:1.7; }
  .warn { background:#fff3e0; border-inline-start:4px solid #ef6c00; padding:10px 12px; border-radius:6px; margin-top:14px; font-size:14px; }
  .btns { display:flex; gap:8px; margin-top:16px; flex-wrap:wrap; }
  button, .webbtn { font-family:inherit; font-size:14px; padding:10px 14px; border:none; border-radius:8px; cursor:pointer; background:var(--acc); color:#fff; }
  .webbtn { display:inline-block; text-decoration:none; }
  .webbtn.wiki { background:#33691e; }
  #back { background:rgba(255,255,255,.25); margin-bottom:8px; }
  .empty { text-align:center; color:#888; padding:40px 0; }
</style>
</head>
<body>
<header>
  <div id="topbar" style="display:none"><button id="back">→ بازگشت به فهرست</button></div>
  <h1>🌿 گیاهان دارویی</h1>
  <div class="searchwrap"><input id="q" type="search" placeholder="جستجوی گیاه… (نام فارسی)" autocomplete="off"></div>
  <div id="cnt"></div>
</header>
<main id="view"></main>
<script src="herbs_20k.js"></script>

<script>
var FALLBACK = "data:image/svg+xml;utf8," + encodeURIComponent(
  '<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160">' +
  '<rect width="160" height="160" fill="#e8f0e9"/>' +
  '<text x="80" y="92" font-size="64" text-anchor="middle">🌿</text></svg>');

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escAttr(s){ return esc(s).replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

// highlight matched prefix of query inside name (prefix-first, then substring)
function hl(text, q){
  var t = esc(text);
  if(!q) return t;
  var idx = text.toLowerCase().indexOf(q);
  if(idx < 0) idx = text.indexOf(q);
  if(idx < 0) return t;
  return esc(text.slice(0,idx)) + '<mark>' + esc(text.slice(idx, idx+q.length)) + '</mark>' + esc(text.slice(idx+q.length));
}

var state = { view:'list', herb:null, q:'', scroll:0 };

var qEl = document.getElementById('q');
var view = document.getElementById('view');
var cnt = document.getElementById('cnt');
var topbar = document.getElementById('topbar');

function normalize(s){
  s = String(s).trim().toLowerCase();
  s = s.replace(/\u064A/g,'\u06CC').replace(/\u0643/g,'\u06A9');
  s = s.replace(/\u200C/g,' ').replace(/\u0622/g,'\u0627').replace(/\u0623/g,'\u0627').replace(/\u0625/g,'\u0627');
  s = s.replace(/\u0629/g,'\u0647');
  return s.replace(/\s+/g,' ');
}
var INDEX = HERBS.map(function(h,i){ return { i:i, n: h.faNorm || normalize(h.fa) }; });

var shown = [];
function doSearch(q){
  state.q = q;
  if(!q){ shown = HERBS.map(function(h,i){ return i; }).slice(0, 200); cnt.textContent = 'نمایش ' + shown.length + ' از ' + HERBS.length + ' گیاه — برای جستجو تایپ کنید'; renderList(); return; }
  var nq = normalize(q), res = [];
  for(var k=0;k<INDEX.length;k++){
    var n = INDEX[k].n;
    var p = n.indexOf(nq);
    if(p === 0) res.push([0, INDEX[k].i]);
    else if(p > 0) res.push([1, INDEX[k].i]);
    if(res.length > 3000) break;
  }
  res.sort(function(a,b){ return a[0]-b[0] || a[1]-b[1]; });
  shown = res.map(function(r){ return r[1]; }).slice(0, 300);
  cnt.textContent = shown.length ? shown.length + ' نتیجه' : 'نتیجه‌ای یافت نشد';
  renderList();
}

function renderList(){
  state.view='list'; topbar.style.display='none';
  if(!shown.length){ view.innerHTML = '<div class="empty">گیاهی با این نام پیدا نشد.</div>'; return; }
  var html = '';
  for(var k=0;k<shown.length;k++){
    var h = HERBS[shown[k]];
    html += '<div class="item" data-i="'+h.id+'" data-idx="'+shown[k]+'">' +
      '<img src="'+escAttr(h.imageUrl)+'" alt="" loading="lazy" onerror="this.src=FALLBACK">' +
      '<div><div class="nm">'+hl(h.fa, state.q)+'</div>' +
      '<div class="sci">'+esc(h.sci||'')+'</div></div></div>';
  }
  view.innerHTML = html;
}

view.addEventListener('click', function(e){
  var it = e.target.closest('.item');
  if(it) openDetail(+it.getAttribute('data-idx'));
});

function openDetail(idx){
  saveScroll();
  state.view='detail'; state.herb=idx;
  var h = HERBS[idx];
  topbar.style.display='block';
  var webBtns = '<div class="btns">' +
    '<a class="webbtn" target="_blank" rel="noopener" href="https://www.google.com/search?hl=fa&q='+encodeURIComponent(h.fa)+'">🔎 جستجو در وب</a>' +
    '<a class="webbtn wiki" target="_blank" rel="noopener" href="'+escAttr(h.wikiUrl)+'">📖 ویکی‌پدیا</a></div>';
  view.innerHTML = '<div class="detail">' +
    '<img src="'+escAttr(h.imageUrl)+'" alt="" style="width:96px;height:96px;border-radius:12px;object-fit:cover;background:#eee" onerror="this.src=FALLBACK">' +
    '<h2>'+esc(h.fa)+'</h2>' +
    (h.sci?'<div class="sci">'+esc(h.sci)+'</div>':'') +
    '<div><span class="chip">'+esc(h.cat||'—')+'</span>'+(h.fam?'<span class="chip">'+esc(h.fam)+'</span>':'')+'</div>' +
    (h.prop&&h.prop.length?'<div class="sec"><h3>خواص</h3><ul>'+h.prop.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul></div>':'') +
    (h.ind&&h.ind.length?'<div class="sec"><h3>موارد مصرف</h3><ul>'+h.ind.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul></div>':'') +
    (h.warn?'<div class="warn"><b>⚠️ هشدار:</b> '+esc(h.warn)+'</div>':'') +
    webBtns + '</div>';
  window.scrollTo(0,0);
}

document.getElementById('back').addEventListener('click', backToList);
function backToList(){
  state.view='list'; state.herb=null;
  topbar.style.display='none';
  doSearch(state.q);
  window.scrollTo(0, state.scroll||0);
}
function saveScroll(){ if(state.view==='list') state.scroll = window.scrollY; }

// live filtering on each character
qEl.addEventListener('input', function(){ doSearch(qEl.value); });
qEl.addEventListener('keydown', function(e){
  if(e.key==='Enter' && shown.length){ openDetail(shown[0]); }
});

// cache data1.js via service worker for offline use
if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
}

doSearch('');
</script>
</body>
</html>
